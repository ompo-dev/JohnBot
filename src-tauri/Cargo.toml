[package]
name = "johnbot"
version = "0.1.0"
description = "JohnBot desktop launcher"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "johnbot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
