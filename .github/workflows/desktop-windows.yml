name: Desktop Windows Release
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Set up Rust stable
        run: rustup default stable

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Rust formatting check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build Tauri bundle (NSIS)
        run: bun run tauri build --bundles nsis

      - name: Stage release artifacts and compute checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-artifacts | Out-Null

          $builtExe = "src-tauri/target/release/johnbot.exe"
          if (-not (Test-Path $builtExe)) {
            throw "Built binary not found at $builtExe"
          }
          Copy-Item -Path $builtExe -Destination "dist-artifacts/johnbot.exe"

          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer not found in src-tauri/target/release/bundle/nsis/"
          }
          Copy-Item -Path $installer.FullName -Destination "dist-artifacts/$($installer.Name)"

          $portableStage = "dist-artifacts/staging/JohnBot-portable-windows-x64"
          New-Item -ItemType Directory -Force -Path "$portableStage/runtime" | Out-Null
          Copy-Item -Path $builtExe -Destination "$portableStage/johnbot.exe"
          Copy-Item -Path "src-tauri/runtime/compose.yaml" -Destination "$portableStage/runtime/compose.yaml"

          Compress-Archive -Path "$portableStage/*" -DestinationPath "dist-artifacts/JohnBot-portable-windows-x64.zip" -Force

          Get-ChildItem -Path dist-artifacts -File | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Out-File -FilePath dist-artifacts/SHA256SUMS.txt -Encoding ascii

      - name: Upload Windows x64 artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: JohnBot-Windows-x64
          path: |
            dist-artifacts/*.exe
            dist-artifacts/*.zip
            dist-artifacts/SHA256SUMS.txt
          retention-days: 7
