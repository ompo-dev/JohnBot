name: Infrastructure
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: infrastructure-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: "0"
      NEXT_TELEMETRY_DISABLED: "1"
      REDIS_URL: redis://127.0.0.1:6379
      DATABASE_URL: postgresql://johnbot:johnbot_ci@127.0.0.1:5432/johnbot
      JOHNBOT_DATA_MODE: demo
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: johnbot
          POSTGRES_USER: johnbot
          POSTGRES_PASSWORD: johnbot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U johnbot -d johnbot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0


      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2, resolved 2026-11-11
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run db:validate
      - run: bun run db:migrate
      - run: bun run db:check
      - run: bun run test:database
      - run: bun run test:jobs
      - run: bun tests/integration/postgres-workspace.test.ts
      - run: bun run test:unit
      - run: bun run test:operations:ui
      - run: bun run test:dashboard:ui
      - run: bun run check
      - name: Check hook rejection and partial stages
        run: HUSKY= node .husky/test-hooks.mjs
      - run: bun run styles:check
      - run: node .github/scripts/test-style-fixture.mjs
      - run: bun run test:routines-ui
      - name: Redis claim ownership and PostgreSQL cross-process updates
        run: bun tests/integration/data-concurrency.test.ts
      - run: bun run build
      - name: Data stack integration against PostgreSQL and Redis
        run: bun run test:data-stack
      - name: Domain integrations against PostgreSQL and Redis
        run: bun run test:domains
      - run: docker compose config --quiet
      - name: Build and load local Docker image
        run: docker build --tag johnbot:ci .
      - name: Smoke test container health and non-root user
        run: bash .github/scripts/smoke-image.sh johnbot:ci
      - name: Build worker and migration images with frozen dependency subsets
        run: |
          docker build --target migrations --tag johnbot-migrations:ci .
          docker build --target worker --tag johnbot-worker:ci .
          test "$(docker image inspect johnbot-worker:ci --format '{{.Config.User}}')" = nextjs
  publish:
    needs: verify
    if: >-
      github.event_name == 'push' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require release commit on default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"
      - name: Build and publish verified revision
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --tag "$image:sha-$GITHUB_SHA" .

          bash .github/scripts/smoke-image.sh "$image:sha-$GITHUB_SHA"


          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker push "$image:sha-$GITHUB_SHA"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            docker tag "$image:sha-$GITHUB_SHA" "$image:$GITHUB_REF_NAME"
            docker push "$image:$GITHUB_REF_NAME"
          else
            docker tag "$image:sha-$GITHUB_SHA" "$image:latest"
            docker push "$image:latest"
          fi
