name: johnbot

x-data-environment: &data-environment
  JOHNBOT_DATA_MODE: ${JOHNBOT_DATA_MODE:-postgres}
  # Do not inherit DATABASE_URL from host tooling: `127.0.0.1` means the container itself.
  DATABASE_URL: ${JOHNBOT_DATABASE_URL:-postgresql://johnbot:johnbot_dev_only@postgres:5432/johnbot}
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: johnbot
      POSTGRES_USER: johnbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-johnbot_dev_only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U johnbot -d johnbot"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Internal only: Redis must not be reachable from the host. The web service
    # connects over the compose network at redis:6379.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  migrations:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrations
    image: johnbot:migrations
    environment: *data-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    image: johnbot:worker
    environment:
      <<: *data-environment
      JOHNBOT_WORKER_CONCURRENCY: ${JOHNBOT_WORKER_CONCURRENCY:-4}
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "bun", "-e", "if(Date.now()-Number(await Bun.file('/tmp/johnbot-worker-health').text())>30000)process.exit(1)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: johnbot:local
    ports:
      - "127.0.0.1:${JOHNBOT_PORT:-3000}:3000"
    environment:
      <<: *data-environment
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      JOHNBOT_LOG_LEVEL: ${JOHNBOT_LOG_LEVEL:-info}
      JOHNBOT_COOKIE_SECURE: ${JOHNBOT_COOKIE_SECURE:-0}
      JOHNBOT_DASHBOARD_MODEL: ${JOHNBOT_DASHBOARD_MODEL:-}
      JOHNBOT_DASHBOARD_API_KEY: ${JOHNBOT_DASHBOARD_API_KEY:-}
      JOHNBOT_DASHBOARD_BASE_URL: ${JOHNBOT_DASHBOARD_BASE_URL:-https://api.openai.com/v1}
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  postgres-data:
  redis-data:
